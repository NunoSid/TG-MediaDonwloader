name: Telegram Media Library Android

on:
  push:
    branches: [telegram-media-library]
    paths:
      - 'android/**'
      - '.github/workflows/telegram-media-library-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch TDLib Android AAR
        working-directory: android
        run: bash scripts/fetch-tdlib.sh

      - name: Build debug and unsigned release APKs
        working-directory: android
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Decode permanent release keystore
        if: ${{ env.RELEASE_KEYSTORE_B64 != '' }}
        working-directory: android
        run: echo "$RELEASE_KEYSTORE_B64" | base64 --decode > release-keystore.jks

      - name: Build signed release APK
        if: ${{ env.RELEASE_KEYSTORE_B64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ env.RELEASE_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramMediaLibrary-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramMediaLibrary-release
          path: android/app/build/outputs/apk/release/app-release.apk
