name: Telegram Media Library Android

on:
  push:
    branches: [telegram-media-library]
    paths:
      - 'android/**'
      - '.github/workflows/telegram-media-library-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch TDLib Android AAR
        working-directory: android
        run: bash scripts/fetch-tdlib.sh

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramMediaLibrary-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
