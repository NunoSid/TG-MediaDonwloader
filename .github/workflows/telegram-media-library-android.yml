name: TG Media Library Android

on:
  push:
    branches: [telegram-media-library]
    paths:
      - 'android/**'
      - '.github/workflows/telegram-media-library-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android 16 SDK is installed
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Fetch TDLib Android AAR
        working-directory: android
        run: bash scripts/fetch-tdlib.sh

      - name: Build debug, release and Play bundle compile checks
        working-directory: android
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace

      - name: Upload unsigned Play bundle for internal signing only
        uses: actions/upload-artifact@v4
        with:
          name: TGMediaLibrary-play-bundle-unsigned-internal
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 1
          if-no-files-found: error

      - name: Check permanent release signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$RELEASE_KEYSTORE_B64" && -n "$RELEASE_STORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Permanent Android release signing is configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Permanent Android release signing secrets are not fully configured. No signed release artifact will be published by this run."
          fi

      - name: Decode permanent release keystore
        if: ${{ steps.signing.outputs.available == 'true' }}
        working-directory: android
        shell: bash
        run: |
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > release-keystore.jks
          test -s release-keystore.jks
          chmod 600 release-keystore.jks

      - name: Build signed APK and Play bundle
        if: ${{ steps.signing.outputs.available == 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ env.RELEASE_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify signed APK and Play bundle
        if: ${{ steps.signing.outputs.available == 'true' }}
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found in Android build-tools."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify -strict -certs "$AAB"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TGMediaLibrary-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload signed release APK
        if: ${{ steps.signing.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: TGMediaLibrary-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload signed Play Store AAB
        if: ${{ steps.signing.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: TGMediaLibrary-playstore-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove decoded signing material
        if: ${{ always() && steps.signing.outputs.available == 'true' }}
        working-directory: android
        shell: bash
        run: rm -f release-keystore.jks
