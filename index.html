<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f3f0e8" />
<meta name="description" content="TG//MEDIA — single-file ephemeral Telegram media downloader. Each user uses their own API ID and API Hash." />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://esm.sh; connect-src 'self' https://esm.sh https: wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
<title>TG//MEDIA — Single HTML</title>
<style>
:root {
  color-scheme: light;
  --ink: #111111;
  --paper: #f3f0e8;
  --panel: #fffdf7;
  --muted: #6f6b62;
  --line: #151515;
  --soft-line: #c9c4b8;
  --acid: #e7ff3f;
  --cyan: #62e7ff;
  --pink: #ff6fae;
  --danger: #ff4c4c;
  --shadow: 7px 7px 0 #111;
  --shadow-small: 4px 4px 0 #111;
  --radius: 0px;
  --max: 1320px;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); font-family: "Arial Narrow", "Roboto Condensed", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
button { color: inherit; }
a { color: inherit; }
::selection { background: var(--acid); color: var(--ink); }

.site-shell { min-height: 100vh; background-image: linear-gradient(rgba(17,17,17,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(17,17,17,.035) 1px, transparent 1px); background-size: 28px 28px; }
.topbar { position: sticky; top: 0; z-index: 20; background: rgba(243,240,232,.94); border-bottom: 2px solid var(--line); backdrop-filter: blur(14px); }
.topbar-inner { max-width: var(--max); height: 76px; margin: 0 auto; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; }
.brand-mark { width: 44px; height: 44px; display: inline-grid; place-items: center; background: var(--acid); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); transform: rotate(-2deg); }
.brand-mark svg { width: 36px; height: 36px; }
.bm-frame { fill: none; stroke: var(--ink); stroke-width: 2.2; }
.bm-cut { fill: var(--ink); }
.bm-bolt { fill: var(--pink); stroke: var(--ink); stroke-width: 1.5; }
.brand-copy { display: grid; line-height: 1; gap: 4px; }
.brand-copy strong { font-size: 16px; letter-spacing: .08em; font-weight: 950; }
.brand-copy small { font-size: 8px; letter-spacing: .24em; color: var(--muted); font-weight: 850; }
.top-actions { display: flex; align-items: center; gap: 12px; }
.top-link, #footer-privacy { border: 0; background: transparent; padding: 8px 4px; cursor: pointer; text-transform: uppercase; letter-spacing: .11em; font-size: 10px; font-weight: 900; }
.top-link:hover, #footer-privacy:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.lang-switch { display: inline-flex; border: 2px solid var(--ink); background: var(--panel); }
.lang-switch button { border: 0; background: transparent; padding: 7px 9px; cursor: pointer; font-size: 10px; font-weight: 950; }
.lang-switch button + button { border-left: 2px solid var(--ink); }
.lang-switch button.active { background: var(--ink); color: var(--paper); }

.main-shell { max-width: var(--max); margin: 0 auto; padding: 70px 28px 110px; }
.product-intro { margin-bottom: 42px; }
.origin-line { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; letter-spacing: .13em; font-weight: 900; }
.signal-dot { width: 9px; height: 9px; background: var(--pink); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
.hero-grid { display: grid; grid-template-columns: minmax(0,1fr) 250px; align-items: end; gap: 44px; }
.product-intro h1 { margin: 0; max-width: 860px; font-size: clamp(54px, 8vw, 104px); line-height: .84; letter-spacing: -.07em; text-transform: uppercase; font-weight: 1000; }
.product-intro p { max-width: 760px; margin: 28px 0 0; font-size: 18px; line-height: 1.55; font-weight: 620; }
.hero-badge { justify-self: end; width: 230px; border: 2px solid var(--ink); background: var(--panel); box-shadow: var(--shadow-small); transform: rotate(1.5deg); }
.hero-badge span { display: block; padding: 10px 14px; border-bottom: 2px solid var(--ink); font-family: ui-monospace, monospace; font-size: 13px; font-weight: 950; letter-spacing: .12em; }
.hero-badge span:nth-child(1) { background: var(--acid); }
.hero-badge span:nth-child(2) { background: var(--cyan); }
.hero-badge span:nth-child(3) { background: var(--pink); }
.hero-badge b { display: block; padding: 13px 14px; font-size: 36px; line-height: 1; text-align: right; }

.workspace { display: grid; gap: 26px; }
.panel, .session-strip { border: 2px solid var(--ink); background: var(--panel); box-shadow: var(--shadow); }
.panel { padding: 30px; }
.panel-header, .filter-head, .media-section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 28px; }
.panel-header { margin-bottom: 24px; }
.panel-header h2, .panel-intro h2, .filter-head h2 { margin: 6px 0 7px; font-size: 28px; line-height: 1; text-transform: uppercase; letter-spacing: -.04em; font-weight: 950; }
.panel-header p, .panel-intro p, .filter-head p { max-width: 710px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
.section-number, .eyebrow { display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; font-weight: 950; letter-spacing: .13em; text-transform: uppercase; }
.section-number { padding: 4px 7px; background: var(--ink); color: var(--paper); }

.auth-panel { display: grid; grid-template-columns: minmax(280px,.8fr) minmax(440px,1.2fr); gap: 54px; }
.panel-intro { padding-top: 2px; }
.auth-form { display: grid; gap: 16px; }
.field-grid.two { display: grid; grid-template-columns: .58fr 1.42fr; gap: 12px; }
.field { display: grid; gap: 7px; }
.field > span { font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: .09em; text-transform: uppercase; font-weight: 900; }
.input, .select { width: 100%; height: 46px; border: 2px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink); outline: 0; padding: 0 12px; box-shadow: none; transition: background .12s, box-shadow .12s; }
.input:focus, .select:focus { background: var(--acid); box-shadow: 3px 3px 0 var(--ink); }
.input::placeholder { color: #99958c; }
.text-link { margin-top: 20px; padding: 0; border: 0; background: transparent; cursor: pointer; font-size: 12px; font-weight: 900; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.session-choice { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 12px 14px; border: 2px solid var(--ink); background: #fff; }
.session-choice > div { display: grid; gap: 4px; }
.session-choice strong { font-size: 13px; }
.session-choice small { color: var(--muted); font-size: 11px; }
.toggle { position: relative; flex: 0 0 auto; }
.toggle input { position: absolute; opacity: 0; }
.toggle span { display: block; width: 44px; height: 24px; padding: 3px; border: 2px solid var(--ink); background: var(--paper); cursor: pointer; }
.toggle span::after { content: ''; display: block; width: 14px; height: 14px; background: var(--ink); transition: transform .15s; }
.toggle input:checked + span { background: var(--cyan); }
.toggle input:checked + span::after { transform: translateX(20px); }

.button { min-height: 42px; border: 2px solid var(--ink); border-radius: 0; padding: 0 15px; background: var(--panel); font-size: 11px; letter-spacing: .035em; text-transform: uppercase; font-weight: 950; cursor: pointer; transition: transform .08s, box-shadow .08s, background .08s; }
.button:hover:not(:disabled) { transform: translate(-2px,-2px); box-shadow: 3px 3px 0 var(--ink); }
.button:active:not(:disabled) { transform: translate(0,0); box-shadow: none; }
.button:disabled { opacity: .35; cursor: not-allowed; }
.button.primary { background: var(--acid); }
.button.secondary { background: var(--cyan); }
.button.quiet { background: transparent; border-color: transparent; }
.button.quiet:hover:not(:disabled) { border-color: var(--ink); background: var(--panel); }
.button.danger { background: var(--danger); color: #fff; }
.compact-button { min-height: 35px; padding: 0 11px; font-size: 9px; }
.wide-button { width: 100%; min-height: 48px; }

.session-strip { min-height: 72px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
.session-user { display: flex; align-items: center; gap: 12px; }
.session-user > div { display: grid; gap: 2px; }
.session-user small { font-family: ui-monospace, monospace; font-size: 9px; text-transform: uppercase; letter-spacing: .1em; }
.session-user strong { font-size: 14px; }
.online-dot { width: 12px; height: 12px; background: var(--acid); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }

.selection-count, .download-total, .total-chip { display: grid; justify-items: end; gap: 1px; }
.selection-count strong, .download-total strong, .total-chip strong { font-size: 34px; line-height: 1; letter-spacing: -.06em; }
.selection-count span, .download-total span, .total-chip span { font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.chat-toolbar { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; margin-bottom: 12px; }
.search-box { min-height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 11px; border: 2px solid var(--ink); background: #fff; }
.search-box:focus-within { background: var(--cyan); box-shadow: 3px 3px 0 var(--ink); }
.search-box svg { width: 16px; height: 16px; fill: none; stroke: var(--ink); stroke-width: 2; }
.search-box input { width: 100%; border: 0; background: transparent; outline: 0; }
.chat-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; max-height: 390px; overflow: auto; padding: 2px 6px 4px 2px; }
.chat-choice { min-width: 0; min-height: 62px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 9px 10px; border: 2px solid var(--soft-line); background: #fff; cursor: pointer; }
.chat-choice:hover { border-color: var(--ink); }
.chat-choice.selected { border-color: var(--ink); background: var(--acid); box-shadow: 3px 3px 0 var(--ink); }
.chat-choice input { position: absolute; opacity: 0; pointer-events: none; }
.chat-avatar, .source-avatar { display: grid; place-items: center; background: var(--ink); color: #fff; font-family: ui-monospace, monospace; font-weight: 900; }
.chat-avatar { width: 38px; height: 38px; font-size: 10px; }
.chat-copy { min-width: 0; display: grid; gap: 3px; }
.chat-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.chat-copy small { color: var(--muted); font-family: ui-monospace, monospace; font-size: 9px; text-transform: uppercase; }
.check-indicator { width: 22px; height: 22px; border: 2px solid var(--ink); background: var(--panel); display: grid; place-items: center; }
.check-indicator svg { width: 15px; fill: none; stroke: var(--ink); stroke-width: 2.2; opacity: 0; }
.chat-choice.selected .check-indicator svg { opacity: 1; }
.scan-action-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
.scan-status { min-width: 0; flex: 1; display: grid; gap: 6px; margin-left: 8px; }
.scan-status span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: ui-monospace, monospace; font-size: 9px; color: var(--muted); }
.progress-track { height: 12px; border: 2px solid var(--ink); background: #fff; overflow: hidden; }
.progress-track.slim { height: 8px; }
.progress-fill { height: 100%; width: 0; background: repeating-linear-gradient(135deg,var(--pink) 0 10px,var(--acid) 10px 20px); transition: width .16s; }
.loading-state { min-height: 110px; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: ui-monospace, monospace; font-size: 10px; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--ink); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.results-shell { padding: 30px; }
.filter-panel { margin: 8px 0 24px; padding: 20px; box-shadow: none; background: #f8f5ed; }
.filter-head { align-items: center; margin-bottom: 16px; }
.filter-head h2 { font-size: 18px; }
.quick-filter-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; }
.file-search { grid-column: span 2; }
.advanced-filters { margin-top: 12px; border-top: 2px dashed var(--ink); padding-top: 10px; }
.advanced-filters summary { list-style: none; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-family: ui-monospace, monospace; font-size: 10px; font-weight: 900; text-transform: uppercase; }
.advanced-filters summary::-webkit-details-marker { display: none; }
.advanced-filters summary span { font-size: 20px; }
.advanced-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; margin-top: 12px; }
.media-stack { display: grid; gap: 22px; }
.media-section { border: 2px solid var(--ink); background: #fff; }
.media-video { box-shadow: 5px 5px 0 var(--acid); }
.media-photo { box-shadow: 5px 5px 0 var(--cyan); }
.media-audio { box-shadow: 5px 5px 0 var(--pink); }
.media-section-head { padding: 20px 20px 14px; }
.media-title-wrap { display: flex; gap: 14px; align-items: flex-start; }
.media-glyph { width: 46px; height: 46px; flex: 0 0 auto; display: grid; place-items: center; border: 2px solid var(--ink); background: var(--paper); }
.media-video .media-glyph { background: var(--acid); }
.media-photo .media-glyph { background: var(--cyan); }
.media-audio .media-glyph { background: var(--pink); }
.media-glyph svg, .queue-breakdown svg { width: 24px; height: 24px; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: square; stroke-linejoin: miter; }
.media-title-wrap h3 { margin: 3px 0 4px; font-size: 24px; line-height: 1; text-transform: uppercase; font-weight: 950; letter-spacing: -.035em; }
.media-title-wrap p { margin: 0; color: var(--muted); font-size: 12px; }
.media-stats { display: flex; gap: 26px; }
.media-stats > div { display: grid; justify-items: end; gap: 2px; }
.media-stats strong { font-size: 22px; line-height: 1; }
.media-stats span { font-family: ui-monospace, monospace; font-size: 8px; text-transform: uppercase; color: var(--muted); }
.section-actions { display: flex; gap: 6px; padding: 0 20px 14px; }
.table-wrap { overflow-x: auto; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
table { width: 100%; min-width: 850px; border-collapse: collapse; table-layout: fixed; }
th { padding: 9px 10px; background: var(--ink); color: var(--paper); text-align: left; font-family: ui-monospace, monospace; font-size: 8px; text-transform: uppercase; letter-spacing: .08em; }
th:first-child { width: 42px; }
th:nth-child(2) { width: 29%; }
th:nth-child(3) { width: 20%; }
td { padding: 10px; border-bottom: 1px solid #d8d3c8; font-size: 11px; vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: #f8f5ed; }
.check-col { text-align: center; }
.media-check { width: 17px; height: 17px; accent-color: var(--ink); cursor: pointer; }
.file-cell { min-width: 0; display: grid; gap: 3px; }
.file-cell strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
.file-cell small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-family: ui-monospace, monospace; font-size: 8px; }
.source-cell { display: flex; min-width: 0; align-items: center; gap: 7px; }
.source-cell > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.source-avatar { width: 24px; height: 24px; flex: 0 0 auto; font-size: 7px; }
.protected-row { opacity: 1; }
.protected-row .file-cell small { opacity: .82; }
.empty-row { height: 86px; text-align: center; color: var(--muted); font-family: ui-monospace, monospace; font-size: 10px; }
.media-footer { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 9px 14px; font-family: ui-monospace, monospace; font-size: 8px; color: var(--muted); }
.pagination { display: flex; align-items: center; gap: 8px; }

.queue-breakdown { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 20px; }
.queue-breakdown span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 9px; border: 2px solid var(--ink); background: #fff; font-family: ui-monospace, monospace; font-size: 9px; text-transform: uppercase; font-weight: 900; }
.queue-breakdown span:nth-child(1) { background: var(--acid); }
.queue-breakdown span:nth-child(2) { background: var(--cyan); }
.queue-breakdown span:nth-child(3) { background: var(--pink); }
.queue-breakdown svg { width: 15px; height: 15px; }
.download-controls { display: flex; align-items: end; justify-content: space-between; gap: 18px; }
.concurrency { width: 180px; flex: 0 0 auto; }
.download-buttons { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.download-note { margin: 12px 0 0; color: var(--muted); font-size: 10px; }
.download-progress-panel { margin-top: 18px; padding-top: 18px; border-top: 2px dashed var(--ink); }
.progress-meta { display: flex; justify-content: space-between; gap: 20px; margin-top: 10px; }
.progress-meta > div { display: grid; gap: 2px; }
.progress-meta small { font-family: ui-monospace, monospace; font-size: 8px; text-transform: uppercase; color: var(--muted); }
.progress-meta strong { font-size: 12px; }
.current-file { margin-top: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: ui-monospace, monospace; font-size: 9px; color: var(--muted); }

.footer { max-width: var(--max); margin: 0 auto; padding: 28px; display: flex; align-items: center; justify-content: space-between; border-top: 2px solid var(--ink); font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
.modal { width: min(92vw, 590px); border: 0; padding: 0; background: transparent; }
.modal::backdrop { background: rgba(17,17,17,.62); backdrop-filter: blur(4px); }
.modal-card { position: relative; border: 2px solid var(--ink); background: var(--panel); box-shadow: 9px 9px 0 var(--ink); padding: 28px; }
.modal-card h2 { margin: 0 44px 16px 0; text-transform: uppercase; font-size: 25px; }
.modal-body, .prompt-card p { color: var(--muted); font-size: 13px; line-height: 1.6; }
.icon-button { width: 34px; height: 34px; display: grid; place-items: center; border: 2px solid var(--ink); background: var(--pink); cursor: pointer; font-size: 20px; font-weight: 900; }
.modal-close { position: absolute; top: 18px; right: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.guide-list { display: grid; gap: 8px; padding: 0; list-style: none; }
.guide-list li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.guide-list li > span { width: 28px; height: 28px; display: grid; place-items: center; background: var(--acid); border: 2px solid var(--ink); color: var(--ink); font-weight: 950; }
.guide-list p { margin: 3px 0 0; }
.notice { padding: 12px; border: 2px solid var(--ink); background: var(--cyan); color: var(--ink); }
.notice.warning { background: var(--pink); }
.prompt-input { margin-top: 8px; }
.error-list { display: grid; gap: 8px; padding-left: 18px; }
.error-list li { display: grid; gap: 2px; }
.error-list span { font-family: ui-monospace, monospace; font-size: 9px; }
.muted { color: var(--muted); }
.empty-state { padding: 30px; text-align: center; font-family: ui-monospace, monospace; font-size: 10px; color: var(--muted); border: 2px dashed var(--soft-line); }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 100; max-width: min(90vw, 720px); transform: translate(-50%, 18px); opacity: 0; pointer-events: none; border: 2px solid var(--ink); background: var(--acid); color: var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 12px 15px; font-size: 11px; font-weight: 900; transition: .18s ease; }
.toast.show { opacity: 1; transform: translate(-50%,0); }

@media (max-width: 980px) {
  .hero-grid { grid-template-columns: 1fr; }
  .hero-badge { justify-self: start; width: 100%; max-width: 430px; display: grid; grid-template-columns: repeat(3,1fr) auto; transform: none; }
  .hero-badge span { border-bottom: 0; border-right: 2px solid var(--ink); }
  .hero-badge b { padding: 9px 13px; font-size: 28px; }
  .auth-panel { grid-template-columns: 1fr; gap: 28px; }
  .quick-filter-grid { grid-template-columns: repeat(2,1fr); }
  .advanced-grid { grid-template-columns: repeat(2,1fr); }
  .chat-list { grid-template-columns: 1fr; }
  .media-section-head { display: grid; }
  .media-stats { justify-content: start; }
  .media-stats > div { justify-items: start; }
}
@media (max-width: 700px) {
  .topbar-inner { height: 66px; padding: 0 16px; }
  .brand-copy small { display: none; }
  .top-link { display: none; }
  .main-shell { padding: 44px 16px 74px; }
  .product-intro h1 { font-size: 53px; }
  .product-intro p { font-size: 15px; }
  .hero-badge { grid-template-columns: 1fr 1fr; }
  .hero-badge span { border-bottom: 2px solid var(--ink); }
  .panel { padding: 20px; box-shadow: 5px 5px 0 var(--ink); }
  .field-grid.two, .quick-filter-grid, .advanced-grid { grid-template-columns: 1fr; }
  .file-search { grid-column: auto; }
  .panel-header, .filter-head { display: grid; gap: 12px; }
  .selection-count, .download-total, .total-chip { justify-items: start; }
  .chat-toolbar { grid-template-columns: 1fr 1fr; }
  .search-box { grid-column: 1 / -1; }
  .scan-action-row { flex-wrap: wrap; }
  .scan-status { flex-basis: 100%; margin-left: 0; }
  .media-section-head { padding: 16px; }
  .media-title-wrap { align-items: center; }

function formatBytes(bytes) {
  if (!Number.isFinite(bytes) || bytes <= 0) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let value = bytes;
  let unit = 0;
  while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit += 1; }
  const decimals = value >= 100 || unit === 0 ? 0 : value >= 10 ? 1 : 2;
  return `${value.toFixed(decimals)} ${units[unit]}`;
}

function formatDuration(seconds) {
  if (!Number.isFinite(seconds) || seconds <= 0) return '—';
  const s = Math.floor(seconds % 60);
  const m = Math.floor((seconds / 60) % 60);

  return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}

function errorText(error) {
  if (!error) return 'unknown error';
  if (typeof error === 'string') return error;
  const parts = [];
  if (error.name) parts.push(error.name);
  if (error.message) parts.push(error.message);
  if (error.code !== undefined) parts.push(`code=${error.code}`);
  if (error.errorMessage) parts.push(String(error.errorMessage));
  return parts.join(': ') || String(error);
}

function floodWaitSeconds(error) {
  const direct = Number(error?.seconds ?? error?.retryAfter ?? error?.retry_after ?? error?.value);
  if (Number.isFinite(direct) && direct > 0) return Math.ceil(direct);
  const match = errorText(error).match(/FLOOD_WAIT[_\s:-]*(\d+)/i);
  return match ? Number(match[1]) : 0;
}

function abortableSleep(ms, signal, onTick) {
  return new Promise((resolve, reject) => {
    if (signal?.aborted) { reject(new DOMException('Aborted', 'AbortError')); return; }
    const end = Date.now() + ms;
    let timer = null;
    let ticker = null;
    const cleanup = () => {
      if (timer) clearTimeout(timer);
      if (ticker) clearInterval(ticker);
      signal?.removeEventListener('abort', onAbort);
    };
    const finish = () => { cleanup(); onTick?.(0); resolve(); };
    const onAbort = () => { cleanup(); reject(new DOMException('Aborted', 'AbortError')); };
    const tick = () => onTick?.(Math.max(1, Math.ceil((end - Date.now()) / 1000)));
    signal?.addEventListener('abort', onAbort, { once: true });
    tick();
    ticker = setInterval(tick, 1000);
    timer = setTimeout(finish, ms);
  });
}

function chatKind(peer) {
  const type = String(peer?.type ?? '').toLowerCase();
  const chatType = String(peer?.chatType ?? '').toLowerCase();
  if (type === 'user') return peer?.isBot ? 'bot' : 'user';
  if (chatType.includes('supergroup')) return 'supergroup';
  if (chatType.includes('channel')) return 'channel';
  if (chatType.includes('group')) return 'group';
  if (type === 'channel') return peer?.isBroadcast ? 'channel' : 'supergroup';
  if (type === 'chat') return 'group';
  return 'group';
}

function peerUsername(peer) {
  if (typeof peer?.username === 'string' && peer.username) return peer.username.replace(/^@/, '');
  const list = Array.isArray(peer?.usernames) ? peer.usernames : [];
  const active = list.find((entry) => entry?.active !== false && entry?.username);
  return String(active?.username ?? '').replace(/^@/, '');
}

function messageDate(msg) {
  const rawDate = msg?.date;
  let date;
  if (rawDate instanceof Date) date = rawDate;
  else if (typeof rawDate === 'number') date = new Date(rawDate < 10_000_000_000 ? rawDate * 1000 : rawDate);
  else date = new Date(rawDate ?? Date.now());
  return Number.isNaN(date.getTime()) ? new Date() : date;
}

function messageTextAndEntities(msg) {
  const candidates = [msg?.text, msg?.caption, msg?.message, msg?.raw?.message];
  let text = '';
  let entities = [];
  for (const value of candidates) {
    if (typeof value === 'string' && value) { text = value; break; }
    if (value && typeof value === 'object' && typeof value.text === 'string') {
      text = value.text;
      if (Array.isArray(value.entities)) entities = value.entities;
      break;
    }
  }
  if (!entities.length) {
    const entityCandidates = [msg?.entities, msg?.text?.entities, msg?.caption?.entities, msg?.raw?.entities];
    entities = entityCandidates.find(Array.isArray) ?? [];
  }
  return { text, entities };
}

function normalizeUrl(value) {
  let url = String(value ?? '').trim().replace(/[),.;!?]+$/g, '');
  if (!url) return null;
  if (/^(www\.|t\.me\/)/i.test(url)) url = `https://${url}`;
  if (!/^(https?:\/\/|tg:\/\/)/i.test(url)) return null;
  try {
    if (/^https?:\/\//i.test(url)) return new URL(url).href;
    return url;
  } catch { return null; }
}

function domainForUrl(url) {
  try { return new URL(url).hostname.replace(/^www\./i, '') || 'telegram'; }
  catch { return String(url).startsWith('tg://') ? 'telegram' : 'link'; }
}

function extractLinks(msg) {
  const { text, entities } = messageTextAndEntities(msg);
  const found = new Set();
  const add = (value) => { const normalized = normalizeUrl(value); if (normalized) found.add(normalized); };
  const regex = /(?:https?:\/\/|tg:\/\/|www\.|t\.me\/)[^\s<>"']+/gi;
  for (const match of text.matchAll(regex)) add(match[0]);
  for (const entity of entities) {
    if (!entity || typeof entity !== 'object') continue;
    const type = String(entity.type ?? entity._ ?? entity.constructor?.name ?? '').toLowerCase();
    if (typeof entity.url === 'string') add(entity.url);
    if ((type.includes('url') || type.includes('texturl')) && Number.isFinite(Number(entity.offset)) && Number.isFinite(Number(entity.length))) {
      const offset = Number(entity.offset); const length = Number(entity.length);
      add(text.slice(offset, offset + length));
    }
  }
  const webpageCandidates = [msg?.media?.url, msg?.media?.webpage?.url, msg?.media?.webPage?.url, msg?.raw?.media?.webpage?.url, msg?.raw?.media?.webPage?.url];
  for (const candidate of webpageCandidates) if (typeof candidate === 'string') add(candidate);
  return [...found];
}

function contentProtected(msg, chatPeer) {
  return Boolean(
    chatPeer?.hasContentProtection ?? msg?.chat?.hasContentProtection ?? msg?.isContentProtected ??
    msg?.isProtected ?? msg?.raw?.noforwards ?? msg?.raw?.noForwards ?? false
  );
}

function originalMessageUrl(source, messageId) {
  const username = String(source?.username ?? '').replace(/^@/, '');
  if (!username || !messageId) return '';
  return `https://t.me/${encodeURIComponent(username)}/${messageId}`;
}

class TelegramService {
  client = null;
  globalPauseUntil = 0;
  lastScanStartedAt = 0;
  minGapMs = 1400;

  get connected() { return this.client !== null; }
  get rawClient() { if (!this.client) throw new Error('Telegram client is not connected'); return this.client; }

  async createClient(apiId, apiHash) {
    if (this.client) { try { await this.client.destroy(); } catch { /* ignore */ } }
    const storage = new MemoryStorage();
    this.client = new TelegramClient({ apiId, apiHash, storage, disableUpdates: false });
    return this.client;
  }

  async loginPhone(apiId, apiHash, phone, remember, callbacks) {
    const client = await this.createClient(apiId, apiHash);
    const user = await client.start({
      phone,
      code: callbacks.getCode,
      password: callbacks.getPassword,
      invalidCodeCallback: async (type) => callbacks.onInvalid?.(type),
    });
    return { displayName: user.displayName ?? user.firstName ?? 'Telegram' };
  }

  async loginQr(apiId, apiHash, callbacks, signal) {
    const client = await this.createClient(apiId, apiHash);
    const user = await client.start({
      qrCodeHandler: (url, expires) => callbacks.onQr?.(String(url), expires),
      password: callbacks.getPassword,
      invalidCodeCallback: async (type) => callbacks.onInvalid?.(type),
      abortSignal: signal,
    });
    return { displayName: user.displayName ?? user.firstName ?? 'Telegram' };
  }


  async getChats(onProgress) {
    const client = this.rawClient;
    const result = [];
    let count = 0;
    for await (const dialog of client.iterDialogs({ archived: 'keep', pinned: 'keep' })) {
      const peer = dialog?.peer ?? dialog?.chat ?? dialog?.entity;
      if (!peer) continue;
      const kind = chatKind(peer);
      const title = String(peer.displayName ?? peer.title ?? dialog.title ?? `Chat ${count + 1}`);
      const id = String(peer.id ?? dialog.id ?? count);
      result.push({ key: `${kind}:${id}`, id, title, kind, username: peerUsername(peer), peer });
      count += 1;
      if (count % 25 === 0) onProgress?.(count);
    }
    return result.sort((a, b) => a.title.localeCompare(b.title));
  }

  async resolveScanPeer(peer) {
    const client = this.rawClient;
    const attempts = [peer];
    if (peer && Number.isFinite(Number(peer.id))) attempts.push(Number(peer.id));
    if (typeof client.resolvePeer === 'function') {
      for (const candidate of attempts) {
        if (candidate == null) continue;
        try { return await client.resolvePeer(candidate); } catch { /* try next */ }
      }
    }
    return attempts.find((value) => value != null);
  }

  async waitForRateWindow(signal, onTick) {
    const now = Date.now();
    const gapWait = Math.max(0, this.lastScanStartedAt + this.minGapMs - now);
    const floodWait = Math.max(0, this.globalPauseUntil - now);
    const waitMs = Math.max(gapWait, floodWait);
    if (waitMs > 0) await abortableSleep(waitMs, signal, onTick);
    this.lastScanStartedAt = Date.now();
  }

  applyFloodWait(seconds) {
    const safe = Math.max(1, Number(seconds) || 1) + 3;
    this.globalPauseUntil = Math.max(this.globalPauseUntil, Date.now() + safe * 1000);
    return safe;
  }

  makeMediaItem(msg, chatPeer, source) {
    const media = msg?.media;
    if (!media) return null;
    const mediaType = String(media.type ?? '').toLowerCase();
    const mimeType = String(media.mimeType ?? media.mime ?? media.raw?.mimeType ?? '').toLowerCase();
    const isAnimation = Boolean(media.isAnimation) || mimeType === 'image/gif';
    const isSticker = mediaType === 'sticker' || Boolean(media.isSticker);
    let category = null;
    let kind = mediaType || 'media';
    if (!isAnimation && !isSticker && (mediaType === 'video' || (mediaType === 'document' && mimeType.startsWith('video/')))) {
      category = 'video';
      kind = Boolean(media.isRound ?? media.round ?? media.isVideoNote ?? false) ? 'round' : 'video';
    } else if (!isAnimation && !isSticker && (mediaType === 'photo' || (mediaType === 'document' && mimeType.startsWith('image/')))) {
      category = 'photo';
      kind = mediaType === 'photo' ? 'photo' : 'image-file';
    } else if (!isSticker && (mediaType === 'audio' || mediaType === 'voice' || (mediaType === 'document' && mimeType.startsWith('audio/')))) {
      category = 'audio';
      kind = mediaType === 'voice' || Boolean(media.isVoice) ? 'voice' : 'audio';
    } else if (!isSticker && (mediaType === 'document' || isAnimation)) {
      category = 'document';
      kind = isAnimation ? 'GIF' : 'document';
    }
    if (!category) return null;

    const date = messageDate(msg);
    const messageId = Number(msg.id ?? 0);
    const duration = Number(media.duration ?? media.videoDuration ?? media.audioDuration ?? 0) || 0;
    const width = Number(media.width ?? media.w ?? media.videoWidth ?? media.photoWidth ?? 0) || 0;
    const height = Number(media.height ?? media.h ?? media.videoHeight ?? media.photoHeight ?? 0) || 0;
    const size = Number(media.fileSize ?? media.size ?? media.raw?.size ?? 0) || 0;
    const protectedContent = contentProtected(msg, chatPeer);
    const fallbackExt = category === 'photo' ? 'jpg' : category === 'audio' ? 'mp3' : category === 'video' ? 'mp4' : extensionForMime(mimeType, 'bin');
    const ext = extensionForMime(mimeType, fallbackExt);
    const datePart = date.toISOString().slice(0, 10);
    const sourceName = String(media.fileName ?? media.filename ?? media.name ?? '').trim();
    const fallback = `${category}_${datePart}_${messageId}.${ext}`;
    const name = sanitizeFilename(sourceName || fallback);
    const sourceKey = String(source?.key ?? 'chat');
    if (category === 'document' && kind === 'document') kind = ext ? ext.toUpperCase() : 'FILE';
    const { text } = messageTextAndEntities(msg);

    return {
      key: `${sourceKey}:${messageId}:${category}`,
      messageId, name, size, duration, width, height, date,
      mimeType: mimeType || (category === 'document' ? 'application/octet-stream' : `${category}/${ext}`),
      category, kind, protected: protectedContent, selected: false, media,
      caption: String(text || ''), originalUrl: originalMessageUrl(source, messageId),
      chatKey: sourceKey, chatTitle: String(source?.title ?? 'Telegram'), chatKind: String(source?.kind ?? 'group'),
    };
  }

  makeLinkItems(msg, chatPeer, source) {
    const urls = extractLinks(msg);
    if (!urls.length) return [];
    const date = messageDate(msg);
    const messageId = Number(msg.id ?? 0);
    const sourceKey = String(source?.key ?? 'chat');
    const protectedContent = contentProtected(msg, chatPeer);

  document.querySelector('#download-folder')?.addEventListener('click', () => void startDownload('folder')); document.querySelector('#download-browser')?.addEventListener('click', () => void startDownload('browser')); document.querySelector('#pause-download')?.addEventListener('click', pauseDownload); document.querySelector('#resume-download')?.addEventListener('click', resumeDownload); document.querySelector('#stop-download')?.addEventListener('click', () => downloader.stop()); document.querySelector('#retry-failed')?.addEventListener('click', () => void startDownload(state.lastDownloadMode || 'folder', state.failedDownloads));
  document.querySelector('#export-csv')?.addEventListener('click', () => exportLibrary('csv')); document.querySelector('#export-txt')?.addEventListener('click', () => exportLibrary('txt')); document.querySelector('#activity-download')?.addEventListener('click', downloadActivity); document.querySelector('#activity-clear')?.addEventListener('click', clearActivity);
}
